<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Night_Cipher</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="profile">

        <!-- Profile header -->
        <header class="profile-header">
            <div class="avatar">
                <!-- Your profile picture will go here later -->
            </div>

            <div class="profile-name">
                <h1>Night_Cipher</h1>
                <p>@Night_Cipher</p>
            </div>
        </header>


        <!-- Pronouns -->
        <section class="profile-section">
            <h2>Pronouns</h2>
            <span>he / him</span>
            <span>they / them</span>
        </section>


        <!-- About -->
        <section class="profile-section">
            <h2>About</h2>

            <p>
                Hello! I'm Night_Cipher.
                This is my little corner of the internet.
            </p>
        </section>

<!-- Interests -->
        <section class="profile-section">
            <h2>Interests</h2>

            <div class="tags">
                <span>Writing</span>
                <span>Storytelling</span>
                <span>Character Creation</span>
                <span>Worldbuilding</span>
                <span>Gaming</span>
            </div>
        </section>


        <!-- Links -->
        <section class="profile-section">
            <h2>Links</h2>

            <div class="links">
                <a href="#">Discord</a>
                <a href="#">Tumblr</a>
                <a href="#">AO3</a>
            </div>
        </section>


        <!-- Footer -->
        <footer>
            <p>Made by NightmareScar</p>
        </footer>

    </main>

</body>
</html>
